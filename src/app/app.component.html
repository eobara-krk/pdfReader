


<main class="main">
  <div class="content">
    <h1>Spis treści z Worda</h1>
    <div *ngIf="pdfPages.length">
      <div [innerHTML]="pdfPages[0]" (click)="onTocClick($event)"></div>
    </div>
    <div *ngIf="selectedSectionText" class="section-content">
  <h2>Wybrana sekcja</h2>
  <div>{{ selectedSectionText }}</div>
  <button (click)="speakSectionText()">Start</button>
  <button (click)="pauseSpeech()">Pauza</button>
  <button (click)="stopSpeech()">Stop</button>
    </div>
  </div>
</main>
