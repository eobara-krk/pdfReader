<main class="main">
  <div class="content">
    <div class="header-logo-title">
      <div class="logo-box">
        <img src="source.png" alt="Logo" class="logo-img" />
      </div>
      <h1 class="header-title">Nadzieja nie zawodzi (Rz 5,5)</h1>
    </div>
    <div class="close-btn" title="Zamknij stronę" (click)="closePage()">&#10005;</div>
    <div class="pdf-x-wrapper">
      <a href="Spes non confundit_jesień_2025_wersja rozesłana.pdf" target="_blank" class="pdf-link" title="Pobierz PDF">📑 PDF</a>
    </div>
    <!-- Tylko wersja z drzewkiem i folderami -->
  <h3 class="header-subtitle" style="
    font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; font-weight: 500; text-align: center; font-size: 1.12rem; margin-top: 0.2rem; margin-bottom: 0.18rem; letter-spacing: 0.01em;
    background: linear-gradient(90deg, #00bfae 0%, #1769aa 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; text-shadow: 0 2px 12px rgba(23,105,170,0.09);">
  Materiały formacyjne dla Katolickiej Odnowy w Duchu Świętym Archidiecezji Wrocławskiej<br>pdf. Opracował Ks. Rajmund Pietkiewicz</h3>
    <div style="margin-bottom: 18px; text-align: center;">
      <!-- Usunięto wybór głosu, domyślnie 'A Marka' -->
    </div>
    <div *ngIf="pdfPages.length" class="toc-tree">
      <ul class="tree-list">
        <li *ngFor="let link of filteredPdfLinks; let i = index" [class.active]="selectedSectionText && selectedSectionIndex === i">
          <div class="tree-folder-row">
            <span class="tree-icon" (click)="toggleSection(i, $event)">📁</span>
            <span class="tree-desc" (click)="toggleSection(i, $event)" [innerHTML]="highlightCzesc(link)"></span>
          </div>
          <div *ngIf="selectedSectionText && selectedSectionIndex === i" class="tree-content">
            <div class="tree-controls">
              <button (click)="speakSectionText()">Start</button>
              <button (click)="stopSpeech()">Stop</button>
            </div>
            <textarea readonly class="tree-textarea">{{ selectedSectionText }}</textarea>
          </div>
        </li>
      </ul>
    </div>
    <div class="watermark">&#64;EO</div>
  </div>
</main>
